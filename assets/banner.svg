<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-label="Musa Anwaar. Forward Deployed Engineer and AI Solutions Architect. Diagram of an agent loop: request to harness, tools, response, with evals feeding back."><style>
:root{--bg:#ffffff;--chip:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--accent2:#1a7f37;--glow:#0969da22}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--chip:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent2:#3fb950;--glow:#58a6ff33}}
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.c{fill:var(--chip);stroke:var(--line)}.t{font-size:12.5px;fill:var(--text)}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.t1{font-size:40px;font-weight:800;letter-spacing:-1px}.cursor{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style><rect x=".5" y=".5" width="839" height="229" rx="14" fill="var(--bg)" stroke="var(--line)"/><pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="8" r="1" fill="var(--line)"/></pattern><rect x="1" y="1" width="838" height="228" rx="13" fill="url(#d)" opacity=".55"/><text x="36" y="46" font-size="12" fill="var(--muted)">musa@prod:~$ <tspan fill="var(--accent)">whoami</tspan></text><text class="sans t1" x="34" y="98" fill="var(--text)">Musa Anwaar</text><text x="36" y="128" font-size="14.5" fill="var(--accent)" font-weight="700">Forward Deployed Engineer</text><text x="36" y="150" font-size="14.5" fill="var(--text)">AI Solutions Architect</text><text x="36" y="188" font-size="12" fill="var(--muted)">agents · harnesses · evals · cost control</text><rect class="cursor" x="36" y="198" width="8" height="14" fill="var(--accent)"/><path d="M584 95 L618 95" fill="none" stroke="var(--line)" stroke-width="1.4"/><path d="M722 88 C740 88 742 55 758 55" fill="none" stroke="var(--line)" stroke-width="1.4"/><path d="M722 108 C740 108 742 135 758 135" fill="none" stroke="var(--line)" stroke-width="1.4"/><path d="M670 128 L670 189 L596 189" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M542 176 L542 112" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="500" y="78" width="84" height="34" rx="8" fill="var(--chip)" stroke="var(--line)" stroke-width="1"/><text x="542.0" y="99.0" font-size="11.5" fill="var(--text)" text-anchor="middle">request</text><rect x="618" y="62" width="104" height="66" rx="8" fill="var(--chip)" stroke="var(--accent)" stroke-width="1.4"/><text x="670.0" y="92.0" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="700">harness</text><text x="670.0" y="108.0" font-size="9.5" fill="var(--muted)" text-anchor="middle">router · loop</text><rect x="758" y="40" width="64" height="30" rx="8" fill="var(--chip)" stroke="var(--line)" stroke-width="1"/><text x="790.0" y="59.0" font-size="11.5" fill="var(--text)" text-anchor="middle">tools</text><rect x="758" y="120" width="64" height="30" rx="8" fill="var(--chip)" stroke="var(--line)" stroke-width="1"/><text x="790.0" y="139.0" font-size="11.5" fill="var(--text)" text-anchor="middle">response</text><rect x="420" y="176" width="196" height="26" rx="7" fill="var(--chip)" stroke="var(--line)" stroke-dasharray="3 3"/><text x="518" y="192.5" font-size="10.5" fill="var(--muted)" text-anchor="middle">evals · routing · outcome</text><circle r="3.2" fill="var(--accent)"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M584 95 L618 95"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle><circle r="3.2" fill="var(--accent)"><animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M722 88 C740 88 742 55 758 55"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle><circle r="3.2" fill="var(--accent2)"><animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite" path="M722 108 C740 108 742 135 758 135"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle><circle r="3.2" fill="var(--muted)"><animateMotion dur="5.6s" begin="0.4s" repeatCount="indefinite" path="M670 128 L670 189 L596 189"/><animate attributeName="opacity" values="0;1;1;0" dur="5.6s" begin="0.4s" repeatCount="indefinite"/></circle></svg>
